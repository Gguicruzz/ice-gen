<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produto | ICE GEN</title>

    <link rel="icon" href="/assets/ice-gen-logo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="topbar product-topbar">
        <a class="brand" href="/#inicio" aria-label="ICE GEN, início"><span class="brand-mark" aria-hidden="true"><img src="/assets/ice-gen-logo.png" alt=""></span><span><span class="brand-name">ICE GEN</span><span class="brand-caption">PRATA 925</span></span></a>
        <nav class="nav-links" aria-label="Navegação principal"><a href="/#produtos">Joias</a><a href="/#sobre">Sobre</a><a href="/#atendimento">Contato</a></nav>
        <a class="secondary-link" href="/#produtos">← Voltar à loja</a>
    </header>

    <main class="product-page" id="productPage">
        <div class="product-image"><img id="product-image" src="" alt=""></div>
        <div class="product-info">
            <span id="product-category"></span>
            <h1 id="product-name">Carregando produto...</h1>
            <strong id="product-price"></strong>
            <p id="product-description"></p>
            <div class="product-specs"><h2>Detalhes da peça</h2><dl><div><dt>Material</dt><dd>Prata 925</dd></div><div><dt>Acabamento</dt><dd>Polido</dd></div><div><dt>Estilo</dt><dd id="product-style">Versátil</dd></div></dl></div>
            <div class="quantity"><label for="product-quantity">Quantidade</label><input id="product-quantity" type="number" value="1" min="1" max="10"></div>
            <button id="add-to-cart" type="button">Adicionar à sacola</button>
            <div class="product-tools"><button id="favorite-product" type="button" aria-pressed="false">♡ <span>Salvar nos favoritos</span></button><button id="share-product" type="button">Compartilhar peça ↗</button></div>
            <p class="product-note">A prata 925 pode escurecer naturalmente com o tempo. Guarde sua peça seca e limpe com uma flanela macia.</p>
            <p id="product-status" role="status"></p>
        </div>
    </main>

    <script src="produto.js"></script>

</body>

</html>
